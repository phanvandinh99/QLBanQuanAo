{% extends "layout.html" %}
{% block content %}
<div style="padding: 50px; text-align: center;">
    <h1>🧪 Simple Toast Test</h1>
    
    <div style="margin: 30px 0;">
        <button onclick="testSuccess()" style="padding: 15px 30px; margin: 10px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Test Success Toast
        </button>
        
        <button onclick="testError()" style="padding: 15px 30px; margin: 10px; font-size: 16px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Test Error Toast
        </button>
        
        <button onclick="testWarning()" style="padding: 15px 30px; margin: 10px; font-size: 16px; background: #ffc107; color: black; border: none; border-radius: 5px; cursor: pointer;">
            Test Warning Toast
        </button>
        
        <button onclick="testInfo()" style="padding: 15px 30px; margin: 10px; font-size: 16px; background: #17a2b8; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Test Info Toast
        </button>
    </div>
    
    <div style="margin: 30px 0;">
        <button onclick="testMultiple()" style="padding: 15px 30px; margin: 10px; font-size: 16px; background: #6f42c1; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Test Multiple Toasts
        </button>
        
        <button onclick="clearAll()" style="padding: 15px 30px; margin: 10px; font-size: 16px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Clear All Toasts
        </button>
    </div>
    
    <div id="status" style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 5px; font-family: monospace;">
        Status: Ready to test
    </div>
</div>

<script>
function updateStatus(message) {
    document.getElementById('status').textContent = 'Status: ' + message;
}

function testSuccess() {
    updateStatus('Testing success toast...');
    if (window.toast) {
        window.toast.success('✅ Success toast working!');
        updateStatus('Success toast sent');
    } else {
        updateStatus('ERROR: window.toast not found');
    }
}

function testError() {
    updateStatus('Testing error toast...');
    if (window.toast) {
        window.toast.error('❌ Error toast working!');
        updateStatus('Error toast sent');
    } else {
        updateStatus('ERROR: window.toast not found');
    }
}

function testWarning() {
    updateStatus('Testing warning toast...');
    if (window.toast) {
        window.toast.warning('⚠️ Warning toast working!');
        updateStatus('Warning toast sent');
    } else {
        updateStatus('ERROR: window.toast not found');
    }
}

function testInfo() {
    updateStatus('Testing info toast...');
    if (window.toast) {
        window.toast.info('ℹ️ Info toast working!');
        updateStatus('Info toast sent');
    } else {
        updateStatus('ERROR: window.toast not found');
    }
}

function testMultiple() {
    updateStatus('Testing multiple toasts...');
    if (window.toast) {
        window.toast.success('Toast 1: Success');
        setTimeout(() => window.toast.warning('Toast 2: Warning'), 300);
        setTimeout(() => window.toast.info('Toast 3: Info'), 600);
        setTimeout(() => window.toast.error('Toast 4: Error'), 900);
        updateStatus('Multiple toasts sent');
    } else {
        updateStatus('ERROR: window.toast not found');
    }
}

function clearAll() {
    updateStatus('Clearing all toasts...');
    if (window.toast) {
        window.toast.clearAll();
        updateStatus('All toasts cleared');
    } else {
        updateStatus('ERROR: window.toast not found');
    }
}

// Check toast system on load
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(() => {
        if (window.toast) {
            updateStatus('Toast system loaded successfully');
        } else {
            updateStatus('ERROR: Toast system not loaded');
        }
    }, 1000);
});
</script>
{% endblock content %}
